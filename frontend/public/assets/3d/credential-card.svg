<svg width="400" height="260" viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-glass-bg" x1="0" y1="0" x2="400" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#F7F6FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E8E6FF" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-border" x1="0" y1="0" x2="400" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#DCD9FF" />
      <stop offset="70%" stop-color="#5B5BEF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0" y1="0" x2="60" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B5BEF" />
      <stop offset="100%" stop-color="#7167F6" />
    </linearGradient>
    <linearGradient id="chip-grad" x1="0" y1="0" x2="32" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="50%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="card-depth" x="-10" y="-5" width="420" height="280" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#5B5BEF" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10142F" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Card Body with depth -->
  <g filter="url(#card-depth)">
    <rect x="10" y="10" width="380" height="240" rx="24" fill="url(#card-glass-bg)" stroke="url(#card-border)" stroke-width="1.5" />
  </g>

  <!-- Ambient Holographic Glow Accent -->
  <ellipse cx="320" cy="50" rx="80" ry="50" fill="#E8E6FF" fill-opacity="0.5" filter="blur(20px)" />
  <circle cx="60" cy="200" r="60" fill="#DCD9FF" fill-opacity="0.4" filter="blur(25px)" />

  <!-- Top Header Row -->
  <!-- Chip -->
  <g transform="translate(36, 36)">
    <rect width="36" height="28" rx="6" fill="url(#chip-grad)" stroke="#A5B4FC" stroke-width="1" />
    <path d="M0 14H36M12 0V28M24 0V28" stroke="#6366F1" stroke-width="0.75" stroke-opacity="0.5" />
  </g>

  <!-- LifeKey Verified Stamp -->
  <g transform="translate(260, 36)">
    <rect width="104" height="26" rx="13" fill="#F0EEFF" stroke="#DCD9FF" stroke-width="1" />
    <circle cx="13" cy="13" r="5" fill="#10B981" />
    <path d="M11 13L12.5 14.5L15.5 11.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="17" font-family="'Nura', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#10142F" letter-spacing="0.04em">VERIFIED</text>
  </g>

  <!-- Credential Details -->
  <text x="36" y="105" font-family="'Nura', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#69708A">
    DIGITAL CREDENTIAL PASSPORT
  </text>
  <text x="36" y="132" font-family="'Nura', system-ui, sans-serif" font-size="20" font-weight="800" fill="#10142F">
    Bachelor of Technology
  </text>
  <text x="36" y="153" font-family="'Nura', system-ui, sans-serif" font-size="13" font-weight="600" fill="#5B5BEF">
    Information Technology • D. J. Sanghvi College of Eng.
  </text>

  <!-- Subtle divider -->
  <line x1="36" y1="172" x2="364" y2="172" stroke="#E8E6FF" stroke-width="1" />

  <!-- Bottom Metadata Row -->
  <g transform="translate(36, 186)">
    <text x="0" y="12" font-family="'Nura', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#69708A" letter-spacing="0.06em">HOLDER</text>
    <text x="0" y="28" font-family="'Nura', system-ui, sans-serif" font-size="12" font-weight="700" fill="#10142F">Parth Patil</text>
  </g>

  <g transform="translate(140, 186)">
    <text x="0" y="12" font-family="'Nura', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#69708A" letter-spacing="0.06em">INTEGRITY</text>
    <text x="0" y="28" font-family="'Nura', system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981">SHA-256 Valid</text>
  </g>

  <g transform="translate(240, 186)">
    <text x="0" y="12" font-family="'Nura', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#69708A" letter-spacing="0.06em">SIGNATURE</text>
    <text x="0" y="28" font-family="'Nura', system-ui, sans-serif" font-size="12" font-weight="700" fill="#5B5BEF">RSA-PSS Valid</text>
  </g>

  <!-- Micro QR preview corner -->
  <g transform="translate(330, 184)">
    <rect width="34" height="34" rx="6" fill="#F7F8FC" stroke="#DCD9FF" stroke-width="1" />
    <rect x="4" y="4" width="8" height="8" fill="#10142F" rx="1.5" />
    <rect x="22" y="4" width="8" height="8" fill="#10142F" rx="1.5" />
    <rect x="4" y="22" width="8" height="8" fill="#10142F" rx="1.5" />
    <rect x="15" y="15" width="4" height="4" fill="#5B5BEF" />
    <rect x="22" y="22" width="6" height="6" fill="#10142F" />
  </g>
</svg>
