<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lk-grad-primary" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7167F6" />
      <stop offset="50%" stop-color="#5B5BEF" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="lk-grad-glow" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8E6FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#5B5BEF" stop-opacity="0" />
    </linearGradient>
    <filter id="lk-shadow" x="0" y="2" width="48" height="46" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5B5BEF" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Ambient soft glow behind symbol -->
  <circle cx="24" cy="24" r="18" fill="#F0EEFF" />

  <!-- Outer Interlocking Identity Nodes (Dual Orbit Bow) -->
  <g filter="url(#lk-shadow)">
    <!-- Primary Key Loop (Identity Loop 1) -->
    <circle cx="20" cy="18" r="9" stroke="url(#lk-grad-primary)" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Secondary Intersecting Connection Loop (Connection Loop 2) -->
    <circle cx="28" cy="18" r="9" stroke="url(#lk-grad-primary)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
    
    <!-- Central Connection Core Node -->
    <circle cx="24" cy="18" r="3" fill="url(#lk-grad-primary)" />
    <circle cx="24" cy="18" r="1.5" fill="#FFFFFF" />

    <!-- Stem of Key / Cryptographic Spine -->
    <path d="M24 27V41" stroke="url(#lk-grad-primary)" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Identity Bit Teeth -->
    <path d="M24 33H30" stroke="url(#lk-grad-primary)" stroke-width="3" stroke-linecap="round" />
    <path d="M24 38H32" stroke="url(#lk-grad-primary)" stroke-width="3" stroke-linecap="round" />

    <!-- Soft highlight gleam -->
    <circle cx="16" cy="13" r="1.5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
